<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recreation QA</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { padding: 16px; }
  .pair { display: flex; gap: 18px; margin-bottom: 28px; align-items: flex-start; }
  .pair > div { flex: 0 0 auto; }
  .pair .page, .pair img.ref { height: 660px; width: auto; }
  .pair h4 { font-size: 12px; color: #555; font-weight: 400; margin: 0 0 6px; }
  .pair .page { margin: 0; }
  .pair img.ref { width: 100%; display: block; box-shadow: 0 3px 14px rgba(0,0,0,.25); }
  .nav { margin-bottom: 14px; font-size: 13px; }
  .nav a { margin-right: 8px; color: var(--accent); }
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div id="out"></div>
<script src="assets/app.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const vol = parseInt(params.get("v") || "1");
  const start = parseInt(params.get("from") || "13");
  const count = parseInt(params.get("n") || "3");
  const bk = await (await fetch(`data/book${vol}/pages.json`, {cache:"no-cache"})).json();

  document.getElementById("nav").innerHTML =
    [1, 13, 25, 37, 44, 56, 68, 78, 90, 102]
      .map(n => `<a href="qa.html?v=${vol}&from=${n}&n=3">p${n}–${n + 2}</a>`).join("");

  const out = document.getElementById("out");
  for (let n = start; n < start + count && n <= 108; n++) {
    const rec = await (await fetch(`data/recreated/v${vol}p${n}.json`, {cache:"no-cache"})).json().catch(() => null);
    if (!rec) continue;
    const p = Object.assign({}, bk.pages[n - 1], { b: vol, gn: n });
    const pair = document.createElement("div");
    pair.className = "pair";
    const left = document.createElement("div");
    left.innerHTML = `<h4>Recreated — vol ${vol} p${n}</h4>`;
    left.appendChild(renderRecreated(p, rec, "", {}));
    const right = document.createElement("div");
    right.innerHTML = `<h4>Original scan</h4><img class="ref" src="data/book${vol}/${p.scan}">`;
    pair.appendChild(left);
    pair.appendChild(right);
    out.appendChild(pair);
  }
})();
</script>
</body>
</html>
